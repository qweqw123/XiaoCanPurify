name: Build XiaoCanPurify APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle via apt
        run: sudo apt-get update && sudo apt-get install -y gradle

      # 关键：指定使用 Gradle 8.5 版本生成 Wrapper，完美支持 Java 17 和现代 Android SDK
      - name: Generate Modern Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK for app module
        run: ./gradlew :app:assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XiaoCanPurify-VectorFix-APK
          path: app/build/outputs/apk/debug/*.apk
